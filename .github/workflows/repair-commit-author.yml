name: Repair 0.1.29 commit author

on:
  push:
    branches: [master]
    paths: [.github/workflows/repair-commit-author.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pawchan-publication
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'Solthariel/Pawchan' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and prepare author-only history repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/repair_commit_author.py plan "$RUNNER_TEMP/author-repair"
      - name: Save recoverable original history before any remote rewrite
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: author-repair-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/author-repair/
          if-no-files-found: error
          retention-days: 14
      - name: Apply guarded atomic ref repair and verify unchanged release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/repair_commit_author.py apply "$RUNNER_TEMP/author-repair"
