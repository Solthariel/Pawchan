name: Publish signed release

# A release request on master, or a new version tag. Never pull requests.
on:
  push:
    branches: [master]
    paths: [update/publishing/release-request.json]
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pawchan-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Solthariel/Pawchan' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    name: Build, verify and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PAWCHAN_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/Solthariel/Pawchan/master/update/feed/data-v1.json

    steps:
      - name: Check signing secrets
        env:
          PAWCHAN_KEYSTORE_BASE64: ${{ secrets.PAWCHAN_KEYSTORE_BASE64 }}
          PAWCHAN_KEY_ALIAS: ${{ secrets.PAWCHAN_KEY_ALIAS }}
          PAWCHAN_STORE_PASSWORD: ${{ secrets.PAWCHAN_STORE_PASSWORD }}
          PAWCHAN_KEY_PASSWORD: ${{ secrets.PAWCHAN_KEY_PASSWORD }}
        run: |
          for variable in PAWCHAN_KEYSTORE_BASE64 PAWCHAN_KEY_ALIAS PAWCHAN_STORE_PASSWORD PAWCHAN_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing repository secret: $variable"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate publication request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 update/publishing/tools/publish_feed_release.py --check

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          # No dependency/configuration cache: keep signing data out of shared caches.
          cache-jdk: false

      - name: Accept Android SDK licenses
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # yes normally exits with SIGPIPE; preserve sdkmanager's own exit status.
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          result=${PIPESTATUS[1]}
          set -o pipefail
          exit "$result"

      - name: Install project SDK, NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Check, package and verify signed APK
        env:
          PAWCHAN_KEYSTORE_BASE64: ${{ secrets.PAWCHAN_KEYSTORE_BASE64 }}
          PAWCHAN_KEY_ALIAS: ${{ secrets.PAWCHAN_KEY_ALIAS }}
          PAWCHAN_STORE_PASSWORD: ${{ secrets.PAWCHAN_STORE_PASSWORD }}
          PAWCHAN_KEY_PASSWORD: ${{ secrets.PAWCHAN_KEY_PASSWORD }}
        run: |
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/pawchan-signing.XXXXXX")
          export PAWCHAN_KEYSTORE="$signing_dir/release.jks"
          cleanup() {
            ./gradlew --stop > /dev/null 2>&1 || true
            rm -rf -- "$signing_dir" .gradle/configuration-cache
          }
          trap cleanup EXIT
          printf '%s' "$PAWCHAN_KEYSTORE_BASE64" | base64 --decode > "$PAWCHAN_KEYSTORE"
          unset PAWCHAN_KEYSTORE_BASE64
          test -s "$PAWCHAN_KEYSTORE"
          # Windows commits may not retain executable bits. Source bytes stay unchanged.
          chmod +x gradlew scripts/*.sh
          ./scripts/package-release.sh
          version=$(python3 -c 'import json; print(max(json.load(open("update/publishing/versions.json"))["versions"], key=lambda v: v["code"])["name"])')
          apk="dist/Pawchan-$version.apk"
          keytool -exportcert -keystore "$PAWCHAN_KEYSTORE" \
            -alias "$PAWCHAN_KEY_ALIAS" -storepass:env PAWCHAN_STORE_PASSWORD \
            -file "$signing_dir/certificate.der"
          expected=$(sha256sum "$signing_dir/certificate.der" | cut -d ' ' -f 1)
          signer=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk")
          # Build Tools 37: "V3.0 Signer: ..."; older versions: "Signer #1 ...".
          # Deduplicate schemes, but reject additional distinct signing certificates.
          actual=$(printf '%s\n' "$signer" |
            sed -nE 's/^(Signer #[0-9]+|V[0-9]+([.][0-9]+)? Signer):? certificate SHA-256 digest: ([[:xdigit:]]{64})[[:space:]]*$/\3/p' |
            tr '[:upper:]' '[:lower:]' | sort -u)
          if [[ -z "$actual" ]]; then
            echo "::error::Could not read the APK signing certificate SHA-256 fingerprint"
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            # Certificate fingerprints are public; no passwords or private keys are printed.
            printf 'Expected certificate SHA-256: %s\nActual certificate SHA-256:\n%s\n' "$expected" "$actual"
            echo "::error::APK signature does not match the configured release key"
            exit 1
          fi
          (cd dist && sha256sum --check "Pawchan-$version.apk.sha256")
          {
            echo "## Pawchan $version"
            echo "- LOCAL CHECK and release packaging passed."
            echo "- APK signature matches the configured release key."
            echo "- Signed APK prepared for publication."
            echo "- Device testing remains manual."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and checksum only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pawchan-signed-apk-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish APK and update feed on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 update/publishing/tools/publish_feed_release.py --publish
